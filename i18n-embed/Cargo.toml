[package]
authors = ["Luke Frisken <l.frisken@gmail.com>"]
categories = [
  "localization",
  "internationalization",
  "development-tools::build-utils",
  "wasm",
]
description = "Traits and macros to conveniently embed localization assets into your application binary or library in order to localize it at runtime."
edition = "2018"
exclude = ["i18n/", "i18n.toml"]
keywords = ["embed", "macro", "i18n", "gettext", "fluent"]
license = "MIT"
name = "i18n-embed"
readme = "README.md"
repository = "https://github.com/kellpossible/cargo-i18n/tree/master/i18n-embed"
version = "0.16.0"

[package.metadata.docs.rs]
all-features = true

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
arc-swap = { version = "1", optional = true }
fluent = { workspace = true, optional = true }
fluent-langneg = { workspace = true }
fluent-syntax = { workspace = true, optional = true }
gettext = { workspace = true, optional = true }
i18n-embed-impl = { workspace = true, optional = true }
intl-memoizer = "0.5"
log = { workspace = true }
notify = { version = "8.0.0", optional = true }
parking_lot = { version = "0.12", optional = true }
rust-embed = { workspace = true, optional = true }
sys-locale = { version = "0.3", optional = true }
thiserror = { workspace = true }
tr = { version = "0.1", default-features = false, optional = true }
unic-langid = { workspace = true }
walkdir = { workspace = true, optional = true }
web-sys = { version = "0.3", features = [
  "Window",
  "Navigator",
], optional = true }

[dev-dependencies]
doc-comment = { workspace = true }
env_logger = { workspace = true }
maplit = "1.0"
pretty_assertions = { workspace = true }
serial_test = "3.0"

[features]
default = ["rust-embed"]

fluent-system = [
  "dep:fluent",
  "dep:fluent-syntax",
  "dep:parking_lot",
  "dep:i18n-embed-impl",
  "i18n-embed-impl/fluent-system",
  "dep:arc-swap",
]
gettext-system = [
  "dep:tr",
  "tr/gettext",
  "dep:gettext",
  "dep:parking_lot",
  "dep:i18n-embed-impl",
  "i18n-embed-impl/gettext-system",
]

desktop-requester = ["dep:sys-locale"]
web-sys-requester = ["dep:web-sys"]

filesystem-assets = ["dep:walkdir"]

autoreload = ["dep:notify"]
