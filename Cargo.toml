[package]
authors.workspace = true
categories = [
  "development-tools::cargo-plugins",
  "localization",
  "internationalization",
  "development-tools::build-utils",
]
description = "Cargo sub-command to extract and build localization resources to embed in your application/library"
edition.workspace = true
keywords = ["cargo", "build", "i18n", "gettext", "locale"]
license.workspace = true
name = "cargo-i18n"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.2.13"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.6.7", features = ["cargo"] }
env_logger = { workspace = true }
i18n-build = { workspace = true, features = ["localize"] }
i18n-config = { workspace = true }
i18n-embed = { workspace = true, features = [
  "desktop-requester",
  "gettext-system",
  "fluent-system",
] }
rust-embed = { workspace = true }
tr = { workspace = true, features = ["gettext"] }
unic-langid = { workspace = true }

[lints]
workspace = true

[workspace]
members = [
  "i18n-build",
  "i18n-config",
  "i18n-embed",
  "i18n-embed/i18n-embed-impl",
  "i18n-embed-fl",

  # Examples
  "i18n-embed/examples/library-fluent",
  "i18n-embed/examples/desktop-bin",
  "i18n-embed-fl/examples/web-server",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
env_logger = "0.11"
find-crate = "0.7"
fluent = "0.17"
fluent-langneg = "0.13"
fluent-syntax = "0.12"
gettext = "0.4"
i18n-build = { version = "0.10.0", path = "./i18n-build" }
i18n-config = { version = "0.4.7", path = "./i18n-config" }
i18n-embed = { version = "0.16.0", path = "./i18n-embed" }
i18n-embed-fl = { version = "0.10.0", path = "./i18n-embed-fl" }
i18n-embed-impl = { version = "0.8.4", path = "./i18n-embed/i18n-embed-impl" }
log = "0.4"
once_cell = "1.21"
pretty_assertions = "1.4"
proc-macro2 = "1.0"
quote = "1.0"
rust-embed = "8.12"
serde = "1.0"
serde_derive = "1.0"
syn = { version = "3.0", features = [
  "derive",
  "proc-macro",
  "parsing",
  "printing",
  "extra-traits",
  "full",
] }
thiserror = "2.0"
tr = { version = "0.1", default-features = false, features = ["gettext"] }
unic-langid = "0.9"
walkdir = "2.5"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unreachable_pub = "warn"

[workspace.lints.cargo]
default = "deny"

[workspace.package]
authors = ["Luke Frisken <l.frisken@gmail.com>", "cargo-i18n contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/kellpossible/cargo-i18n"
rust-version = "1.85.1"
